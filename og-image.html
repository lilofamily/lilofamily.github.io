<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocobombas K-boom - Vista Previa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 50%, #228b22 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(630px) rotate(360deg);
            }
        }
        .emoji {
            font-size: 120px;
            margin-bottom: 30px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
            line-height: 1.2;
        }
        .subtitle {
            font-size: 36px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            opacity: 0.95;
        }
        .cta {
            font-size: 42px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px 50px;
            border-radius: 50px;
            border: 3px solid white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="snowflake" style="left: 10%; animation-duration: 8s;">❄️</div>
    <div class="snowflake" style="left: 30%; animation-duration: 10s; animation-delay: 1s;">❄️</div>
    <div class="snowflake" style="left: 50%; animation-duration: 12s; animation-delay: 2s;">❄️</div>
    <div class="snowflake" style="left: 70%; animation-duration: 9s; animation-delay: 0.5s;">❄️</div>
    <div class="snowflake" style="left: 90%; animation-duration: 11s; animation-delay: 1.5s;">❄️</div>
    
    <div class="emoji">🎄🎅🎁</div>
    <h1>Chocobombas K-boom</h1>
    <p class="subtitle">¡Realiza tu Pedido Ahora!</p>
    <div class="cta">Endulza tu Navidad</div>
</body>
</html>
